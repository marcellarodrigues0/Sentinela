<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema Hospitalar</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h2 class="titulo">

    <img
      src="logo ospital.png"
      alt="Logo Hospital"
      class="logo"
    >

    Sistema Hospitalar

  </h2>

  <input
    id="usuario"
    placeholder="Usuário"
  >

  <input
    id="senha"
    type="password"
    placeholder="Senha"
  >

  <button onclick="login()">
    Entrar
  </button>

</div>

<script>
function login() {

  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      usuario: document.getElementById("usuario").value,
      senha: document.getElementById("senha").value
    })
  })

  .then(async (r) => {
    if (!r.ok) {
      throw new Error("Erro no servidor");
    }
    return await r.json();
  })

  .then(data => {

    if (data.tipo === "medico") {
      window.location.href = "medico.html";
    } else if (data.tipo === "triagem") {
      window.location.href = "triagem.html";
    } else if (data.tipo === "atendimento") {
      window.location.href = "atendimento.html";
    } else {
      alert("Usuário ou senha incorretos.");
    }

  })

  .catch(error => {
    console.error(error);
    alert("Erro ao conectar com o servidor.");
  });

}
</script>

</body>
</html>
